<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Timer Essenziale</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <h2>Timer Asincrono</h2>

    <label for="input-secondi">Inserisci i secondi:</label>
    <input type="number" id="input-secondi" min="1" max="500">
    
    <br><br>
    
    <span>Tempo Rimanente: </span><b id="display-timer"></b>

    <br><br>

    <button id="btn-start" class="btn btn-success">Avvia</button>
    <button id="btn-pausa" class="btn btn-warning">Pausa</button>
    <button id="btn-reset" class="btn btn-danger">Azzera</button>

    <script src="main.js"></script>
</body>
</html>
