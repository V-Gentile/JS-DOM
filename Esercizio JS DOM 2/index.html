<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esercizio JS DOM</title>
</head>
<body>

    <h1>Crea il tuo Articolo</h1>
    
    <div>
        <label for="input-titolo">Titolo:</label><br>
        <input type="text" id="input-titolo" placeholder="Inserisci il titolo..."><br><br>

        <label for="input-paragrafo">Contenuto del Paragrafo:</label><br>
        <textarea id="input-paragrafo" placeholder="Scrivi qui il tuo articolo..."></textarea><br><br>

        <button id="btn-crea">Crea Articolo</button>
    </div>

    <hr>

    <h2>Articoli Pubblicati</h2>
    <section id="zona-articoli"></section>

    <script src="main.js"></script>
</body>
</html>
