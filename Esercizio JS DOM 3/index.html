<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubrica Essenziale con Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

    <div class="container">
        <h2 class="mb-4">Rubrica</h2>

        <div class="row mb-4">
            <div class="col-md-6">
                <input type="text" id="input-nome" class="form-control" placeholder="Nome">
            </div>
            <div class="col-md-6">
                <input type="text" id="input-telefono" class="form-control" placeholder="Telefono">
            </div>
        </div>

        <div class="mb-4">
            <button id="btn-aggiungi" class="btn btn-primary">Aggiungi</button>
            <button id="btn-modifica" class="btn btn-warning">Modifica</button>
            <button id="btn-cancella" class="btn btn-danger">Cancella</button>
            <button id="btn-toggle" class="btn btn-secondary">Nascondi Rubrica</button>
        </div>

        <table class="table table-bordered" id="tabella">
            <thead class="table-light">
                <tr>
                    <th>Nome</th>
                    <th>Telefono</th>
                </tr>
            </thead>
            <tbody id="tbody-contatti">
                </tbody>
        </table>
    </div>

    <script src="main.js"></script>
</body>
</html>
